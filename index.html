<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pago Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css"
        rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="payment-header pb-3">
                    <h1 class="h3">Formulario de Pago</h1>
                    <p class="text-muted">Complete todos los campos requeridos</p>
                </div>

                <form>
                    <div class="row mb-3">
                        <div class="col-md-8 mb-3 mb-md-0">
                            <label for="cardNumber" class="form-label">Número de tarjeta</label>
                            <input type="text" class="form-control" id="cardNumber"
                                placeholder="Introduce el número de tu tarjeta" required>
                        </div>
                        <div class="col-md-2 mb-3 mb-md-0">
                            <label for="cvc" class="form-label">CVC</label>
                            <input type="text" class="form-control" id="cvc" placeholder="CVC" required>
                        </div>
                        <div class="col-md-2">
                            <label for="amount" class="form-label">Monto</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="text" class="form-control" id="amount" placeholder="0.00" required>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Tu nombre" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Tu apellido" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="city" placeholder="Tu ciudad" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="state" class="form-label">Estado</label>
                            <select class="form-select" id="state" required>
                                <option value="" selected disabled>Selecciona un estado</option>
                                <option value="CA">California</option>
                                <option value="NY">Nueva York</option>
                                <option value="TX">Texas</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="message" class="form-label">Mensaje (Opcional)</label>
                        <textarea class="form-control" id="message" rows="2" placeholder="Tu mensaje"></textarea>
                    </div>
                    <hr class="my-4">
                    <div class="payment-methods">
                        <h5 class="mb-3"><strong>Aceptamos:</strong></h5>
                        <div class="d-flex flex-wrap gap-3">
                            <i class="bi bi-credit-card-2-front text-primary" style="font-size: 2rem;"></i>
                            <i class="bi bi-credit-card-2-front text-danger" style="font-size: 2rem;"></i>
                            <i class="bi bi-credit-card-2-front text-info" style="font-size: 2rem;"></i>
                            <i class="bi bi-credit-card-2-front text-success" style="font-size: 2rem;"></i>
                        </div>
                    </div>
                    <div class="notes-section">
                        <label for="notes" class="form-label">Notas adicionales</label>
                        <textarea class="form-control" id="notes" rows="3"
                            placeholder="Agrega cualquier nota aquí"></textarea>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Enviar pago</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
